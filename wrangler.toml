# wrangler.toml
name = "new-store"                   # اسم الـ Worker على Cloudflare
compatibility_date = "2025-12-07"    # تاريخ التوافق للWorkers runtime

# المسار الرئيسي للWorker script (JS/TS)
main = "src/index.ts"

# إعدادات لنشر ملفات static من مجلد dist/
[site]
bucket = "./dist"                    # مجلد الـ build من Vite
entry-point = "workers-site"
